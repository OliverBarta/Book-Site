<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <!-- Cover Gradient: Rich deep purple/indigo to royal purple -->
    <linearGradient id="cover-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c1fff" />
      <stop offset="100%" stop-color="#4c00b3" />
    </linearGradient>

    <!-- Left Page Backing: Medium deep purple -->
    <linearGradient id="left-back-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a04eff" />
      <stop offset="100%" stop-color="#6714cc" />
    </linearGradient>

    <!-- Right Page Backing: Slightly lighter/different angle purple for 3D depth -->
    <linearGradient id="right-back-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b573ff" />
      <stop offset="100%" stop-color="#7b24e6" />
    </linearGradient>

    <!-- Left Page Page Gradient: Soft off-white to subtle lilac shadow near spine -->
    <linearGradient id="left-page-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#fdfbff" />
      <stop offset="100%" stop-color="#eadaff" />
    </linearGradient>

    <!-- Right Page Page Gradient: Subtle lilac shadow near spine to brilliant white -->
    <linearGradient id="right-page-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9c2ff" />
      <stop offset="15%" stop-color="#fcfaff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Bookmark Ribbon Gradient: Radiant purple/magenta to high-contrast violet -->
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e152ff" />
      <stop offset="100%" stop-color="#aa3bff" />
    </linearGradient>

    <!-- Drop Shadow Filter for modern depth -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Group with soft shadow -->
  <g filter="url(#soft-shadow)">
    <!-- Book Cover (Deep Purple Backing) -->
    <path d="M 24,13 C 17,9 8,10 3,14 L 3,36 C 8,32 17,31 24,35 C 31,31 40,32 45,36 L 45,14 C 40,10 31,9 24,13 Z" 
          fill="url(#cover-grad)" />
          
    <!-- Left Page Backing (Thickness / Edge) -->
    <path d="M 24,11 C 18,7.5 9,8.5 4,12.5 L 4,34.5 C 9,30.5 18,29.5 24,33 Z" 
          fill="url(#left-back-grad)" />
    
    <!-- Right Page Backing (Thickness / Edge) -->
    <path d="M 24,11 C 30,7.5 39,8.5 44,12.5 L 44,34.5 C 39,30.5 30,29.5 24,33 Z" 
          fill="url(#right-back-grad)" />

    <!-- Left Page (Main surface) -->
    <path d="M 24,10 C 18.5,6.5 10,7.5 5,11.5 L 5,32.5 C 10,28.5 18.5,27.5 24,31 Z" 
          fill="url(#left-page-grad)" />

    <!-- Right Page (Main surface) -->
    <path d="M 24,10 C 29.5,6.5 38,7.5 43,11.5 L 43,32.5 C 38,28.5 29.5,27.5 24,31 Z" 
          fill="url(#right-page-grad)" />
          
    <!-- Decorative Text Lines (Left Page) -->
    <path d="M 8,16 C 12,13.5 17,13 21,14.5" stroke="#bc9eff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 8,21 C 12,18.5 17,18 21,19.5" stroke="#bc9eff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 8,26 C 12,23.5 17,23 21,24.5" stroke="#bc9eff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Decorative Text Lines (Right Page) -->
    <path d="M 27,14.5 C 31,13 36,13.5 40,16" stroke="#c0a4ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 27,19.5 C 31,18 36,18.5 40,21" stroke="#c0a4ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 27,24.5 C 31,23 36,23.5 40,26" stroke="#c0a4ff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Bookmark Ribbon -->
    <path d="M 22.5,10 L 22.5,35 L 24,33 L 25.5,35 L 25.5,10 Z" 
          fill="url(#ribbon-grad)" />
  </g>
</svg>